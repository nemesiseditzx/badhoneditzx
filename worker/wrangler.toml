name = "badhoneditzx"
main = "worker.js"
compatibility_date = "2026-11-18"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "badhon-editzx-cms"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "badhon-editzx-media"

[vars]
YOUTUBE_HANDLE = "@badhoneditzx"
ALLOWED_ORIGINS = "REPLACE_WITH_YOUR_NETLIFY_SITE_ORIGIN"
PUBLIC_API_BASE = "https://badhoneditzx.nemesiseditzx984.workers.dev"

